<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#4b9da9" />
        <title>TripSplit is offline</title>
        <style>
            :root {
                color-scheme: light;
                --background: #f9fafb;
                --surface: #ffffff;
                --primary: #4b9da9;
                --text: #111827;
                --muted: #6b7280;
                --border: #e5e7eb;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                background: var(--background);
                color: var(--text);
                font-family:
                    Inter, ui-sans-serif, system-ui, -apple-system,
                    BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            main {
                width: min(100%, 420px);
                padding: 28px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface);
                box-shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
            }

            h1 {
                margin: 0 0 12px;
                color: var(--primary);
                font-size: 1.5rem;
                line-height: 1.2;
            }

            p {
                margin: 0 0 20px;
                color: var(--muted);
                line-height: 1.6;
            }

            button {
                width: 100%;
                min-height: 44px;
                border: 0;
                border-radius: 8px;
                background: var(--primary);
                color: #ffffff;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>TripSplit is offline</h1>
            <p>
                Your saved app shell is available once it has been visited.
                Reconnect to refresh trip data or sign in again.
            </p>
            <button type="button" onclick="window.location.reload()">Retry</button>
        </main>
    </body>
</html>
